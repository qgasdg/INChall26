# ft-00 — 사전학습 백본을 그대로 실은 0스텝(제로샷) 구성.
#
# 대회 원본(inha_action_diffusion_11M.yaml)에서 바꾼 것은 두 묶음뿐이다.
#   ① UNet 구조를 backbone.ckpt 실측 shape 에 맞춤 (probe_load.py 로 확정)
#        model_channels 32→320 · channel_mult [1,2,3]→[1,2,4,4]
#        num_head_channels 16→64 · attention_resolutions [4,2]→[4,2,1]
#      원본 값으로는 1,107개 중 1개만 실린다. 이 값으로는 1,517개 중 1,468개(96.8%).
#   ② add_act_time_emb: True — 없으면 time_embed.2 가 shape 불일치로 랜덤 초기화된다.
#   그리고 only_reload_modules 에 "model"(UNet)을 넣어야 백본이 실제로 실린다.

name: ft-01-act12
group: ft

data:
  target: ldwma.lightning.data_modules.lerobot_so100.SO100DataModule
  params:
    root: /home/jovyan/work/INChall26/open/data/train
    remote: False
    dataset_paths: auto
    action_stats_path: /home/jovyan/work/INChall26/open/data/train/so100_action_statistics.json
    normalize_actions: True
    batch_size: 1
    num_workers: 2
    pin_memory: True
    target_height: 320
    target_width: 512
    pad: True
    camera_key: auto
    traj_len: 16
    val_fraction: 0.05
    downsample: 1
    use_language: False

model:
  pretrained_checkpoint: /home/jovyan/work/INChall26/open/baseline/checkpoints/backbone.ckpt
  only_reload_modules:
    ["model", "first_stage_model", "cond_stage_model", "embedder", "image_proj_model"]
  base_learning_rate: 1e-4
  scale_lr: False
  target: lvdm.models.ddpm3d.LatentVisualDiffusion
  params:
    save_only_unet: True
    linear_warmup_steps: 250
    rescale_betas_zero_snr: True
    parameterization: "v"
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: video
    cond_stage_key: caption
    cond_stage_trainable: False
    image_proj_model_trainable: False
    conditioning_key: hybrid
    image_size: [40, 64]
    channels: 4
    scale_by_std: False
    scale_factor: 0.18215
    use_ema: True
    uncond_prob: 0.05
    uncond_type: "empty_seq"
    rand_cond_frame: false
    use_dynamic_rescale: true
    base_scale: 0.7
    fps_condition_type: "fps"
    perframe_ae: True

    unet_config:
      target: lvdm.modules.networks.openaimodel3d.UNetModel
      params:
        action_conditioned: True
        action_dims: 12
        add_act_time_emb: True          # ★ 없으면 time_embed.2 가 안 실린다
        action_dropout_prob: 0.0
        use_scale_shift_norm: False   # ★ backbone 은 False 로 학습됨 (emb_layers 가 정확히 2배 어긋난다)
        in_channels: 8
        out_channels: 4
        model_channels: 320             # ★ backbone 실측
        attention_resolutions:          # ★
          - 4
          - 2
          - 1
        num_res_blocks: 2
        channel_mult:                   # ★
          - 1
          - 2
          - 4
          - 4
        dropout: 0.1
        num_head_channels: 64           # ★
        transformer_depth: 1
        context_dim: 1024
        use_linear: true
        use_checkpoint: True
        temporal_conv: True
        temporal_attention: True
        temporal_selfatt_only: true
        use_relative_position: false
        use_causal_attention: False
        temporal_length: 16
        addition_attention: true
        image_cross_attention: true
        default_fs: 10
        fs_condition: false

    first_stage_config:
      target: lvdm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: True
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
            - 1
            - 2
            - 4
            - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPEmbedder
      params:
        freeze: true
        layer: "penultimate"

    img_cond_stage_config:
      target: lvdm.modules.encoders.condition.FrozenOpenCLIPImageEmbedderV2
      params:
        freeze: true

    image_proj_stage_config:
      target: lvdm.modules.encoders.resampler.Resampler
      params:
        dim: 1024
        depth: 4
        dim_head: 64
        heads: 12
        num_queries: 16
        embedding_dim: 1280
        output_dim: 1024
        ff_mult: 4
        video_length: 16

ddim_kwargs:
  ddim_steps: 50
  unconditional_guidance_scale: 1.0
  timestep_spacing: uniform_trailing
  guidance_rescale: 0.7
  ddim_eta: 1.0
  verbose: False
