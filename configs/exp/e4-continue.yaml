# E4 — 태양님 E3 step14000에서 **같은 조건으로 이어 학습** (2026-07-28 착수).
#
# 왜 넓히지 않는가: 1단계 로그(train_e3r4.log)를 보면 **끊긴 시점이 최고점**이었다.
#   DV_w  0.2098(2k) → 0.2078(4k) → 0.1901(8k) → 0.1986(12k) → **0.1737(14k, 최저)**
#   det_loss 0.05785 → … → **0.05072(14k, 최저)**
#   총 17.4시간만 돌고 멈췄다(--max-days 4를 못 채움). 정체도 오버핏도 아닌 **개선 중 중단**이다.
#   → 용량 부족 근거가 없으니 학습 범위(뒤 2블록)는 그대로 두고 스텝만 더 밟는다.
#   더구나 우리 트레이너에는 **LR 스케줄러가 미구현**이다(config의 lr_schedule은 죽은 키).
#   범위를 넓히면 새 옵티마이저가 warmup 없이 출발해 초반 붕괴 위험이 있는데, 이어받기는 그 위험이 없다.
#
# 1단계(태양님 E3, A40) 실제 명령 — train_e3r4.log 첫 줄에서 복원. 재현 시 이 단계를 먼저 돌린다:
#   impl/w2/train_w2.py --profile a40_bf16 --init-ckpt bridge_frame_ada_0300000_ema.pt
#     --latent-cache <경로> --align-mode shifted --resolution-mode canvas_aligned
#     --ft-mode train --lr 3e-5 --num-workers 1 --ckpt-every 500 --eval-every 2000 --max-days 4
#   → clips=106038 · FT 텐서 48개(103,637,392 params) · micro_batch 1 · step 14000 best(score 0.17368)
#   FT 텐서 48 = 임베더4 + 출력4 + **블록 4개**×10 (블록 1개 = 10텐서·23.9M params).
#   우리 top_blocks=2로 돌리면 28텐서·55.8M이 나와 옵티마이저 상태가 안 맞는다(실측 확인).
#   ★그 스크립트는 태양님 환경의 impl/w2 원본이고 우리 리포는 이식판이라, 우리 코드로 1단계가
#     동일 재현되는지는 미검증이다(교차재현 과제로 남김).
#
# ★재개 절차: ckpts/e3r4_s14000_best.pt 를 out_dir/last.pt 로 복사하면 트레이너가 가중치·옵티마이저·
#   step 14000을 그대로 이어받는다(그 파일의 `{model, opt, step}` 구조가 우리 _state()와 동일).
#   스모크에서 `FT=partial 학습 텐서 48, params 103637392` 가 나와야 1단계와 학습 대상이 일치한다.
#
# ★ckpt 선택: 트레이너 in-loop best는 확산 손실(det_loss) 기준이라 동작 정확도(A_kit)와 무관하다.
#   여기서는 사다리(keep_last)만 남기고 **학습 후 A_kit으로 오프라인 재선택**한다.
#   (킷은 pytorch_lightning이 필요해 학습 env와 공존 불가 → in-loop 편입은 별도 과제)

exp:
  id: e4-continue

data:
  stride: 8               # ★1단계 정합. base.yaml의 4로 돌리면 clips 195,887로 태양님(106,038)의 1.85배가
                          #   되어 데이터 분포가 달라진다 — 같은 조건 이어학습이 아니게 된다.
                          #   검증: 학습 시작 로그의 clips가 106038이어야 한다.

model:
  init_ckpt: ckpts/e3r4_s14000_best.pt   # last.pt가 없어도 가중치는 여기서 실린다(이중 안전장치)
  finetune: {mode: partial}

train:
  lr: 3.0e-5              # 1단계와 동일(로그 실측 `--lr 3e-5`) — 이어가는 학습이라 바꾸지 않는다
  top_blocks: 4           # 1단계와 동일 — 48텐서·103.6M이 맞으려면 4블록(위 계산 참고)
  batch_size: 1           # 1단계 micro_batch=1(슬랙 프로필 확인). 실효 배치를 바꾸면 비교가 오염된다
  grad_accum: 1
  eval_every: 1000        # 1단계는 2000 — 개선 추이를 더 촘촘히 보려고 절반으로
  ckpt_every: 1000
  keep_last: 8            # ★오프라인 A_kit 재선택용 사다리
  # ── 실행 결과(2026-07-28 13:12 ~ 07-30 13:12, V100 fp16, latent 캐시 없음)
  #   step 14,000 → **59,300** (45,300스텝 추가, 48.0h, 3.81 s/step)
  #   det_loss 0.05072(시작) → 0.05019(best=step 55,000) → 0.05033(56k) — 개선 폭 작음
  #   ★재현은 시간이 아니라 스텝으로: 아래 max_steps 59300 이 정본이고 max_wall_hours는 안전장치다.
  max_steps: 59300
  max_wall_hours: 96      # 하드 리밋(느린 GPU에서도 59,300에 도달하도록 여유)
