# E4 — 태양님 E3 step14000에서 이어 학습 (2026-07-28 착수).
#
# 근거(docs/BOARD 7/28): 뭉개짐은 파인튜닝으로 이미 해결됐고(미학습 클립 유지율 45.9%→97.1%),
# 남은 실점은 동작 정확도다. 리더보드 1위 0.05562 → 공식 산식 `0.3D+0.3V+0.4A` 로 역산하면
# 1위의 A_kit ≤ 0.139 인데 우리 정적은 0.4285 — **0.29 이상의 여지**가 동작 쪽에 있다.
#
# ★ckpt 선택: 트레이너의 in-loop best는 확산 손실(det_loss) 기준이라 동작 정확도와 무관하다.
#   여기서는 사다리(keep_last를 크게)만 남기고, **학습 후 A_kit으로 오프라인 재선택**한다.
#   (킷은 pytorch_lightning이 필요해 학습 env와 공존 불가 → in-loop 편입은 별도 과제)

exp:
  id: e4-continue
  # ── 1단계(태양님 E3, A40) 실제 명령 — train_e3r4.log 첫 줄에서 복원. 재현 시 이 단계를 먼저 돌린다.
  #   impl/w2/train_w2.py --profile a40_bf16 --init-ckpt bridge_frame_ada_0300000_ema.pt
  #     --latent-cache <경로> --align-mode shifted --resolution-mode canvas_aligned
  #     --ft-mode train --lr 3e-5 --num-workers 1 --ckpt-every 500 --eval-every 2000 --max-days 4
  #   → clips=106038 · FT 텐서 48개(103,637,392 params) · step 14000에서 best(score 0.17368)
  #   ★주의: 그 스크립트는 태양님 환경의 impl/w2 원본이다. 우리 리포는 그것의 이식판이라
  #     **우리 코드로 1단계가 동일 재현되는지는 미검증**이다(교차재현 과제로 남김).

model:
  # ★태양님 E3 step14000에서 **가중치만** 이어받는다. 학습 범위를 4→12블록으로 넓히면 학습 대상
  #   개수가 달라져 옵티마이저 상태는 이어받을 수 없다(param group 불일치) → step 0부터 새 옵티마이저.
  #   새로 푸는 8개 블록은 태양님도 안 건드린 사전학습 값 그대로라, 처음부터 돌리는 것과 출발점이 같다.
  #   반면 액션 임베더(원래 zero-init)는 14000스텝치 적응이 이미 들어 있어 그대로 챙긴다.
  init_ckpt: ckpts/e3r4_s14000_best.pt
  finetune: {mode: partial}

train:
  lr: 3.0e-5              # ★1단계와 동일값(태양님 로그 실측 `--lr 3e-5`). 새로 푸는 8블록이 사전학습
                          #   값에서 출발하므로 더 낮출 이유는 없고, 올리면 이미 적응된 부분이 흔들린다.
  lr_schedule: {warmup_steps: 200, type: cosine, min_lr: 2.5e-6}
  top_blocks: 12          # 1단계는 뒤 2블록이었다(로그 "학습 파라미터 48개 텐서" = 임베더4+출력4+2블록×20)
                          # → 2→12로 넓힌다. 동작 여지 0.29를 뒤 2블록으로 짜내긴 어렵다
  eval_every: 1000
  ckpt_every: 1000
  keep_last: 8            # ★오프라인 A_kit 재선택용 사다리
  max_wall_hours: 48      # 이틀 예산(사용자 지정). 도달 시 ckpt 저장 후 정상 종료
  max_steps: 200000       # 사실상 무제한 — 실제 종료는 위 시간 예산이 결정
