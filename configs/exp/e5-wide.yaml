# E5 — 학습 범위를 뒤 4블록 → **12블록**으로 넓힌다 (2026-07-30 착수).
#
# 근거: E4(뒤 4블록으로 45,300스텝 추가)가 **완전히 정체**했다. 동일 조건 A_kit(48샘플·eta1.0·20스텝):
#   원본 0.6509 → E3 step14,000 **0.5260**(14,000스텝으로 −0.125)
#                → E4 step55,000 **0.5228**(45,300스텝으로 −0.003)
#   53k~59.3k 흔들림이 0.013이라 −0.003은 잡음 이하. 스텝을 3배 더 밟아 40분의 1을 벌었다.
#   → 스텝 부족이 아니라 **학습 범위(용량)의 한계**로 판단. 이제 넓힐 근거가 생겼다.
#   (E4 착수 시점에는 1단계가 개선 중이었어서 넓힐 근거가 없었다 — 그때 판단은 그때 옳았다.)
#
# ★선행 조건이었던 LR 스케줄러를 구현했다(`trainer.make_lr_fn`). 새로 푸는 8블록은 옵티마이저
#   모멘텀이 0에서 출발하는데 Adam은 첫 스텝 갱신 폭이 사실상 lr 그대로라 사전학습 가중치에
#   충격을 준다 → warmup 500스텝으로 흡수. 진행도는 **이 런에서 밟은 스텝**으로 세므로
#   step 55,000에서 재개해도 warmup이 제대로 걸린다.
#
# 시작점 = **태양님 step 14,000**. E4의 45,300스텝은 A_kit −0.003(잡음 이하)에 그쳤고 구간 끝
#   (59,300)의 A_kit 0.5354가 최고점(55,000의 0.5228)보다 나빠 미약한 과적합 신호까지 있었다 → 버린다.
#   반면 액션 임베더(원래 zero-init)의 14,000스텝치 적응은 A_kit 0.125어치이고 V100에서 다시 벌면
#   ~21시간이 든다 → 챙긴다. 새로 푸는 8블록은 사전학습 값에서 출발하므로 원본에서 시작하는 것과 동일.
#   옵티마이저는 학습 대상 개수가 달라져 이어받지 못한다(새로 시작 — 그래서 warmup이 필요하다).
#
# ★재현성: 이 실험은 "범위를 넓히면 정체가 풀리나"를 빨리 가르는 용도다. 제출용 최종 학습은
#   원본 ckpt에서 **단일 단계**로(데이터 전량 포함) 돌려 재현 스크립트를 단순화한다.

exp:
  id: e5-wide

model:
  init_ckpt: ckpts/e3r4_s14000_best.pt
  finetune: {mode: partial}

train:
  lr: 3.0e-5              # E3·E4와 동일 — 바꾸면 "범위를 넓힌 효과"인지 "lr을 바꾼 효과"인지 못 가른다
  lr_schedule: {warmup_steps: 500, type: cosine, min_lr: 3.0e-6}
  top_blocks: 12          # ★유일한 변경점. 4블록(48텐서·103.6M) → 12블록(예상 128텐서·295M)
  batch_size: 1
  grad_accum: 1
  eval_every: 1000
  ckpt_every: 1000
  keep_last: 8
  # 12블록은 역전파가 늘어 4블록의 3.81 s/step보다 느리다(예상 5~5.5). 48h 기준 약 30,000스텝.
  # step 14,000에서 출발하므로 종점은 14,000+30,000 ≈ 44,000.
  # ★max_steps를 정본으로 두고(스텝 기준 재현) 시간은 여유 있게 잡는다 — 시간이 먼저 끊으면
  #   cosine 감쇠가 끝까지 안 내려가 다른 GPU에서 다른 모델이 나온다.
  max_steps: 44000
  max_wall_hours: 56
