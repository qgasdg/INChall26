# 실험 1개 = 이 파일 1개 + 커밋 해시 1개 (docs/13 §1). base.yaml 위에 "바뀌는 값만" 덮어씀.
# 단일 변수 변경 원칙(docs/04 S6): 한 실험은 손잡이 1개만 움직여 인과 격리.
# 파일명 규칙: exp/<expNN_짧은이름>.yaml  예) exp/exp-01_e3_lora.yaml
#
# ⚠️ 하드웨어 종속값(batch/precision/경로/max_steps)은 여기에 넣지 말 것 → configs/server/ 담당.

meta:
  exp_id: exp-XX            # 통합 원장 ID(exp-01부터)
  ladder: E?               # 실험 사다리 단계(E0~E8, docs/04)
  change: "한 줄 변경점(단일 변수) 설명 — local_lb.csv에도 동일하게 기록"
  hypothesis: "기대 신호(무엇이 어떻게 좋아지는가)"

# --- 이 실험에서 바꾸는 값만 아래에 (예시는 주석) ---
# model:
#   finetune: {mode: lora}     # full | partial | lora
#   lora: {r: 128}             # finetune.mode=lora 일 때
